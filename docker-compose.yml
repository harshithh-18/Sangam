# Sangam — full local stack (SIH PS15)
# Usage:  docker compose up --build   then   docker compose run --rm api python -m scripts.seed
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: jaldrishti
      POSTGRES_PASSWORD: jaldrishti
      POSTGRES_DB: jaldrishti
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaldrishti"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
    volumes:
      - ./backend:/app
      - storage:/data/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
    volumes:
      - ./backend:/app
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app.celery_app worker --loglevel=info

volumes:
  pgdata:
  storage:
